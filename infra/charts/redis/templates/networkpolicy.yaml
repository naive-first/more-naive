# 클러스터 버스(16379)는 비밀번호로 보호되지 않으므로 Redis 파드끼리만 허용한다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "redis.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 6379
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              {{- include "redis.selectorLabels" . | nindent 14 }}
      ports:
        - port: 16379
          protocol: TCP
