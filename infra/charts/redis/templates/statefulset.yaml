apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: {{ .Release.Name }}-headless
  replicas: {{ include "redis.nodeCount" . }}
  # 전체 재시작 때 서로를 다시 찾아야 하므로 순서를 기다리지 않고 함께 띄운다.
  podManagementPolicy: Parallel
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      {{- include "redis.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "redis.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          ports:
            - name: redis
              containerPort: 6379
            - name: cluster-bus
              containerPort: 16379
          env:
            {{- include "redis.passwordEnv" . | nindent 12 }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          # 비밀번호를 명령줄 인자로 넘기면 프로세스 목록에 보이므로 설정 파일로 전달한다.
          # 설정 파일을 전용 디렉터리에 두면 이미지 진입점이 소유자를 redis로 바꾸고 권한을 낮춰 실행한다.
          command:
            - sh
            - -c
            - |
              set -eu
              : "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
              config_dir=/tmp/redis-config
              mkdir -p "$config_dir"
              escaped_password=$(printf '%s' "$REDIS_PASSWORD" | sed 's/[\\"]/\\&/g')
              umask 077
              cat > "$config_dir/redis.conf" <<EOF
              port 6379
              dir /data
              cluster-enabled yes
              cluster-config-file /data/nodes.conf
              cluster-node-timeout 5000
              cluster-bus-port-protected-mode no
              appendonly yes
              maxmemory {{ .Values.maxMemory }}
              maxmemory-policy allkeys-lru
              requirepass "$escaped_password"
              masterauth "$escaped_password"
              EOF
              exec docker-entrypoint.sh redis-server "$config_dir/redis.conf"
          startupProbe:
            exec:
              command: ["sh", "-c", "REDISCLI_AUTH=\"$REDIS_PASSWORD\" redis-cli ping | grep -qx PONG"]
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            exec:
              command: ["sh", "-c", "REDISCLI_AUTH=\"$REDIS_PASSWORD\" redis-cli ping | grep -qx PONG"]
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
        # 파드가 다시 뜨면 IP가 바뀌어 다른 노드가 옛 주소로 찾지 못한다.
        # 이미 클러스터에 속한 노드만 새 주소로 다른 노드를 다시 만나 연결을 복구한다.
        # 최초 기동에서 먼저 만나면 Job의 묶기 명령이 비어 있지 않은 노드로 보고 거부하므로 건너뛴다.
        # postStart 훅에서 하면 6개 파드가 모두 훅이 끝날 때까지 DNS에 공개되지 않아 서로를 찾지 못하므로 별도 컨테이너로 둔다.
        - name: cluster-rejoin
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          env:
            {{- include "redis.passwordEnv" . | nindent 12 }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          command:
            - sh
            - -c
            - |
              export REDISCLI_AUTH="$REDIS_PASSWORD"
              wait_forever() {
                while :; do sleep 3600; done
              }
              attempt=0
              until redis-cli ping 2>/dev/null | grep -qx PONG; do
                attempt=$((attempt + 1))
                [ "$attempt" -ge 120 ] && wait_forever
                sleep 1
              done
              known_nodes=$(redis-cli cluster info | tr -d '\r' | awk -F: '$1 == "cluster_known_nodes" {print $2}')
              [ "${known_nodes:-1}" -gt 1 ] || wait_forever
              pending_ordinals=""
              ordinal=0
              while [ "$ordinal" -lt {{ include "redis.nodeCount" . }} ]; do
                [ "{{ .Release.Name }}-$ordinal" = "$POD_NAME" ] || pending_ordinals="$pending_ordinals $ordinal"
                ordinal=$((ordinal + 1))
              done
              attempt=0
              while [ -n "$pending_ordinals" ] && [ "$attempt" -lt 60 ]; do
                unresolved_ordinals=""
                for ordinal in $pending_ordinals; do
                  peer_ip=$(getent hosts "{{ .Release.Name }}-$ordinal.{{ .Release.Name }}-headless.$POD_NAMESPACE.svc.cluster.local" | awk '{print $1}')
                  if [ -z "$peer_ip" ] || ! redis-cli cluster meet "$peer_ip" 6379 >/dev/null 2>&1; then
                    unresolved_ordinals="$unresolved_ordinals $ordinal"
                  fi
                done
                pending_ordinals=$unresolved_ordinals
                attempt=$((attempt + 1))
                [ -n "$pending_ordinals" ] && sleep 2
              done
              echo "다시 만나지 못한 노드 번호:${pending_ordinals:- 없음}"
              wait_forever
          resources:
            {{- toYaml .Values.clusterRejoin.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ required "storage.className is required" .Values.storage.className | quote }}
        resources:
          requests:
            storage: {{ required "storage.size is required" .Values.storage.size | quote }}
