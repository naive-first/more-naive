name: more-naive-local
services:
  postgres:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE required}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    ports:
      - "127.0.0.1:${DB_PORT:?DB_PORT required}:5432"
    volumes:
      - local-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  local-postgres:
