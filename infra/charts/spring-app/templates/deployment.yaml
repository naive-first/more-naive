{{- $digest := required "image.digest is required" .Values.image.digest -}}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" $digest) -}}
{{- fail "image.digest must be sha256 followed by 64 lowercase hex digits" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: spring-app
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spring-app
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: backend
          image: {{ printf "%s@%s" (required "image.repository is required" .Values.image.repository) $digest | quote }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ required "platform.configMapName is required" .Values.platform.configMapName | quote }}
                  key: {{ required "platform.keys.url is required" .Values.platform.keys.url | quote }}
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.platform.configMapName | quote }}
                  key: {{ required "platform.keys.username is required" .Values.platform.keys.username | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "platform.secretName is required" .Values.platform.secretName | quote }}
                  key: {{ required "platform.keys.password is required" .Values.platform.keys.password | quote }}
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
