apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: more-naive-bootstrap
  namespace: argocd
spec:
  sourceRepos:
  - https://github.com/naive-first/more-naive.git
  destinations:
  - server: https://kubernetes.default.svc
    namespace: argocd
  namespaceResourceWhitelist:
  - group: argoproj.io
    kind: Application
  - group: argoproj.io
    kind: AppProject
  clusterResourceWhitelist: []
