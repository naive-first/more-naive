apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
spec:
  project: more-naive-db
  sources:
    - repoURL: https://github.com/naive-first/more-naive.git
      targetRevision: main
      path: infra/charts/redis
      helm:
        releaseName: redis
        valueFiles:
          - $values/infra/environments/prod/platform.yaml
          - $values/infra/environments/prod/redis.yaml
    - repoURL: https://github.com/naive-first/more-naive.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: more-naive-prod
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
