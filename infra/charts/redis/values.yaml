image:
  repository: redis
  tag: 8.12.0-alpine
podAnnotations: {}
platform:
  secretName: ""
  keys:
    redisPassword: REDIS_PASSWORD
storage:
  className: ""
  size: 1Gi
maxMemory: 64mb
resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi
clusterRejoin:
  resources:
    requests:
      cpu: 5m
      memory: 8Mi
    limits:
      cpu: 50m
      memory: 32Mi
clusterCreateJob:
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi
