apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: more-naive-db
  namespace: argocd
spec:
  sourceRepos:
  - https://github.com/naive-first/more-naive.git
  destinations:
  - server: https://kubernetes.default.svc
    namespace: more-naive-prod
  namespaceResourceWhitelist:
  - group: apps
    kind: StatefulSet
  - group: ''
    kind: Service
  - group: ''
    kind: PersistentVolumeClaim
  - group: networking.k8s.io
    kind: NetworkPolicy
  - group: batch
    kind: Job
  clusterResourceWhitelist: []
